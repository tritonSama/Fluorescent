[package]
name = "fluoderpod_render"
version = "0.1.0"
edition = "2021"
authors = ["Fluorite Engine Contributors"]
description = "GPU-Driven Rendering Architecture utilizing fluoderpod batching"

[lib]
name = "fluoderpod_render"
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = "0.20"
bytemuck = { version = "1.16", features = ["derive"] }
log = "0.4"
tokio = { version = "1.30.0", features = ["full"] }
tokio-tungstenite = "0.20.0"
futures-util = "0.3.28"
serde = { version = "1.0.180", features = ["derive"] }
serde_json = "1.0.100"
jni = "0.22.4"
ash = "0.38.0"

[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.9.0"
ndk-sys = "0.6.0"
