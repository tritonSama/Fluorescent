[package]
name = "fluorite_core"
version = "0.1.0"
edition = "2021"
authors = ["Fluorite Engine Contributors"]
description = "Core high-performance foundation and custom memory allocators for Fluorite AAA Engine"

[lib]
name = "fluorite_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
flutter_rust_bridge = "2.13.0"
execution-rail = { path = "../third_party/tithX/nexus-core/execution-rail" }
mobile-vault-sdk = { path = "../third_party/tithX/nexus-core/mobile-vault-sdk" }
serde_json = "1.0.151"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
bellman = "0.14"
rand = "0.8"
